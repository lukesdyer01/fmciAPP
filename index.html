<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FMCI — Federation of Ministers and Churches International</title>
    <meta name="description" content="A relational network of five-fold ministries, local churches, and marketplace leaders — connected by calling, not hierarchy." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / link previews (iMessage, Facebook, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fmci.network/" />
    <meta property="og:title" content="FMCI — Federation of Ministers and Churches International" />
    <meta property="og:description" content="A relational network of five-fold ministries, local churches, and marketplace leaders — connected by calling, not hierarchy." />
    <meta property="og:image" content="https://fmci.network/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FMCI — Federation of Ministers and Churches International" />
    <meta name="twitter:description" content="A relational network of five-fold ministries, local churches, and marketplace leaders — connected by calling, not hierarchy." />
    <meta name="twitter:image" content="https://fmci.network/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Undoes the ?/ redirect encoding from 404.html (GitHub Pages has no
         server-side rewrites, so a direct load of e.g. /resources 404s and
         gets redirected here) — must run before the app reads the URL. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
