<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>FMCI Network · Email preferences</title><style>body{margin:0;padding:24px;background:#f3f4f6;color:#1f2937;font:16px/1.6 system-ui,sans-serif}main{max-width:480px;margin:10vh auto;background:white;padding:32px;border-radius:16px;box-shadow:0 8px 32px #0001}h1{font-size:24px}button{background:#172b4d;color:white;border:0;padding:14px 20px;border-radius:8px;font:inherit;cursor:pointer}a{color:#172b4d}</style></head><body><main><h1>FMCI Network</h1><div id="message">Loading email preferences…</div></main><script>
